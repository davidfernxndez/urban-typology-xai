name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 10 hours
    - cron: '0 */10 * * *'
  # Allows manual execution from the Actions tab
  workflow_dispatch:

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -s -A "Mozilla/5.0" --max-redirs 0 https://urban-tipology-xai.streamlit.app/ > /dev/null || true